<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>SHK Störungs-Quiz</title><style>
:root{--bg:#07111f;--panel:#101d2f;--panel2:#16263b;--line:#263b54;--text:#f4f7fb;--muted:#9fb0c5;--accent:#28b6ff;--good:#25d58a;--bad:#ff5d67;--warn:#ffc857}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17304a 0,#07111f 45%,#050b14 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;min-height:100vh}
.app{max-width:620px;margin:auto;min-height:100vh;padding:18px 14px 30px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{font-weight:800;letter-spacing:.3px}.brand small{display:block;color:var(--muted);font-weight:500;margin-top:3px}
.badge{background:#102a40;border:1px solid #275172;padding:8px 11px;border-radius:14px;font-size:13px}
.card{background:linear-gradient(145deg,rgba(22,38,59,.96),rgba(10,22,36,.96));border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 18px 50px #0006}
.timerWrap{display:flex;align-items:center;gap:13px}.timer{font-size:40px;font-weight:900;letter-spacing:1px;line-height:1}.timerBar{height:9px;background:#091321;border-radius:20px;overflow:hidden;margin-top:10px;border:1px solid #20344b}.timerFill{height:100%;width:100%;background:linear-gradient(90deg,var(--good),var(--accent));transition:width .1s linear}
.question{font-size:21px;line-height:1.3;font-weight:800;margin:20px 0 8px}.case{color:var(--muted);font-size:14px;line-height:1.45;margin-bottom:17px}
.plant{height:145px;border-radius:18px;background:#0a1624;border:1px solid #20364d;position:relative;overflow:hidden;margin-bottom:18px}
.boiler{position:absolute;left:15%;top:25px;width:82px;height:94px;border-radius:12px;background:linear-gradient(#394c60,#1c2b3b);border:2px solid #64788d}
.boiler:before{content:"KESSEL";position:absolute;top:10px;left:12px;font-size:9px;color:#dce8f3}.screen{position:absolute;left:18px;top:34px;width:46px;height:24px;background:#071018;border:1px solid #4a6176;color:#61d9ff;font-size:10px;display:grid;place-items:center}
.pipe{position:absolute;height:7px;background:#d04c45;border-radius:10px;left:28%;right:9%;top:55px}.pipe.r{top:91px;background:#3975c5}.pump{position:absolute;right:21%;top:65px;width:48px;height:35px;border-radius:50%;background:#273d54;border:2px solid #7390a9}.pump:after{content:"P";display:grid;place-items:center;height:100%;font-weight:900}.valve{position:absolute;right:8%;top:48px;width:25px;height:54px;border-left:5px solid #f0b83d;border-right:5px solid #f0b83d}.sensor{position:absolute;left:48%;top:20px;width:12px;height:12px;border-radius:50%;background:#ffbd43;box-shadow:0 0 12px #ffbd4388}
.options{display:grid;gap:10px}.option{width:100%;text-align:left;padding:15px 14px;border-radius:16px;background:#13253a;border:1px solid #29445f;color:var(--text);font-size:15px;font-weight:700;min-height:58px;cursor:pointer;transition:.15s}.option:active{transform:scale(.985)}.option:disabled{cursor:default}.option.correct{background:#0d4935;border-color:var(--good)}.option.wrong{background:#4a1c26;border-color:var(--bad)}
.feedback{margin-top:14px;padding:14px;border-radius:16px;display:none;line-height:1.45;font-size:14px}.feedback.good{display:block;background:#0d4935;border:1px solid #218b64}.feedback.bad{display:block;background:#4a1c26;border:1px solid #a43d4b}
.actions{display:flex;gap:9px;margin-top:14px}.btn{flex:1;border:0;border-radius:15px;padding:14px;font-weight:800;font-size:14px;cursor:pointer}.next{background:var(--accent);color:#03111c}.quit{background:#1a2b3f;color:#dce8f3}.stats{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-top:12px}
.start{position:fixed;inset:0;background:rgba(4,10,18,.92);display:grid;place-items:center;padding:20px;z-index:10}.startCard{max-width:500px;width:100%;padding:25px;border-radius:28px;background:#0d1b2b;border:1px solid #2b4761;text-align:center}.logo{font-size:58px}.start h1{margin:8px 0}.start p{color:var(--muted);line-height:1.5}.startBtn{width:100%;margin-top:10px;background:var(--accent);color:#03111c;border:0;border-radius:16px;padding:16px;font-size:16px;font-weight:900}
.settings{display:grid;gap:9px;margin:16px 0}.settings label{display:grid;gap:5px;text-align:left;font-size:12px;color:var(--muted);font-weight:700}.settings select{width:100%;padding:12px;border-radius:12px;border:1px solid #29445f;background:#13253a;color:var(--text);font-size:14px}.best{margin-top:12px;color:var(--muted);font-size:12px}.category{display:inline-block;margin-top:5px;padding:4px 8px;border-radius:10px;background:#173650;color:#76d8ff;font-size:11px}.result{display:none;text-align:center}.result .score{font-size:60px;font-weight:900}.result p{color:var(--muted)}.result button{margin-top:10px;width:100%}
@media(min-width:700px){.app{padding-top:28px}}

.mode-grid{display:grid;gap:12px;margin-top:18px}.mode-card{width:100%;text-align:left;border:1px solid #29415c;background:#122238;color:#fff;border-radius:18px;padding:18px;cursor:pointer}.mode-card h3{margin:0 0 7px;font-size:19px}.mode-card p{margin:0;color:#aebbd0;font-size:13px;line-height:1.45}.back{position:fixed;top:12px;left:12px;z-index:20;border:1px solid #29415c;background:#122238;color:#fff;border-radius:12px;padding:9px 13px;font-weight:700;display:none}.menu-note{color:#9fb0c5;font-size:13px;text-align:center;margin-top:10px}.mode-title{font-size:12px;color:#9ed0ff;font-weight:800;letter-spacing:.4px}</style></head><body><button id="back" class="back" onclick="backToMenu()">← Menü</button><div class="app"><div id="menu" class="card"><div class="top"><div class="brand">SHK STÖRUNGS-QUIZ<small>Heizung · Fehlersuche · Prüfung</small></div></div><h2>Modus auswählen</h2><div class="mode-grid"><button class="mode-card" onclick="startMode('azubi')"><h3>👨‍🔧 Azubi-Modus</h3><p>Grundlagen, Bauteile, einfache Messwerte und systematische Fehlersuche.</p></button><button class="mode-card" onclick="startMode('geselle')"><h3>🔧 Geselle-Modus</h3><p>Praxisnahe Störungen mit Hydraulik, Elektrik, Brenner und Regelung.</p></button><button class="mode-card" onclick="startMode('meister')"><h3>🏆 Meister-Modus</h3><p>Anspruchsvolle Diagnose, Messstrategie, Sicherheit und komplexe Fehlerbilder.</p></button></div><div class="menu-note">20 Fragen pro Modus · 30 Sekunden pro Frage · Antworten werden zufällig gemischt.</div></div><div id="game" class="card" style="display:none"><div class="top"><div><div class="mode-title" id="modeTitle"></div><div class="brand">STÖRUNG DIAGNOSE<small>Wähle die technisch richtige Antwort</small></div></div><div class="badge" id="progress">1 / 20</div></div><div class="timerWrap"><div class="timer" id="timer">30</div><div style="flex:1"><div style="color:var(--muted);font-size:12px">ZEIT VERBLEIBEND</div><div class="timerBar"><div class="timerFill" id="timerFill"></div></div></div></div><div class="question" id="question"></div><span class="category" id="categoryBadge">Hydraulik</span><div class="case" id="case"></div><div class="plant"><div class="boiler"><div class="screen" id="screen">STÖR</div></div><div class="pipe"></div><div class="pipe r"></div><div class="pump"></div><div class="valve"></div><div class="sensor"></div></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div><div class="actions"><button class="btn quit" onclick="backToMenu()">← Menü</button><button class="btn next" id="next" onclick="nextQuestion()" disabled>Nächste Frage</button></div><div class="stats"><span id="score">Punkte: 0</span><span id="streak">Serie: 0 🔥</span></div></div><div id="result" class="card result" style="display:none"><div style="font-size:45px">🏆</div><h2>Modus abgeschlossen</h2><div class="score" id="finalScore">0</div><p id="finalText"></p><button class="btn next" onclick="backToMenu()">ZURÜCK ZUM MENÜ</button></div></div><script>const questions=[
['Hydraulik','Anlagendruck kalt 0,6 bar, Heizkörper im OG gluckern. Was ist am wahrscheinlichsten?',['Zu niedriger Anlagendruck','Defekter Außenfühler','Zu hohe Pumpendrehzahl','Verstopfter Gasfilter'],0,'Druck prüfen, Anlage nach Herstellervorgabe füllen und anschließend entlüften bzw. Druck erneut kontrollieren.'],
['Hydraulik','Die Umwälzpumpe brummt, der Volumenstrom bleibt bei 0 m³/h. Was zuerst prüfen?',['Rotor/Laufrad auf Blockierung prüfen','MAG komplett entleeren','Gasdruck erhöhen','Außenfühler tauschen'],0,'Brummen bei fehlendem Volumenstrom passt zu einer blockierten Pumpe bzw. einem blockierten Rotor.'],
['Sensorik','Ein NTC-Vorlauffühler zeigt dauerhaft -40 °C. Was ist typisch?',['Fühlerleitung unterbrochen','Heizkörperventil offen','MAG zu groß','Schmutzfänger sauber'],0,'Ein extrem niedriger Ersatzwert deutet häufig auf Unterbrechung oder fehlenden Fühlerkontakt hin.'],
['Brenner','Der Brenner erhält keine Freigabe. Welche Eingrenzung ist sinnvoll?',['Freigabe- und Sicherheitskette prüfen','Heizkörper entlüften','MAG mit Wasser füllen','Schmutzfänger ausbauen'],0,'Bei fehlender Freigabe müssen Anforderung, Freigabekette und Sicherheitseinrichtungen systematisch geprüft werden.'],
['Warmwasser','Warmwasser bleibt bei 30 °C, Speicherladepumpe läuft trotz Anforderung nicht. Was zuerst?',['Pumpe, Versorgung und Ansteuerung prüfen','Außenfühler tauschen','Anlagendruck auf 0 bar ablassen','Heizkörperventile schließen'],0,'Bei Speicherladung sind Ladepumpe, Versorgung und Ansteuerung die ersten Prüfpunkte.'],
['Hydraulik','Vorlauf 90 °C, Rücklauf sehr kalt, Anlage meldet Übertemperatur. Was passt?',['Kein ausreichender Volumenstrom','MAG mit zu hohem Vordruck','Zu großer Heizkörper','Zu niedrige Raumtemperatur'],0,'Stark aufgeheizter Vorlauf bei kaltem Rücklauf kann auf fehlenden oder stark reduzierten Volumenstrom hinweisen.'],
['Hydraulik','3-Wege-Ventil fährt trotz Warmwasseranforderung nicht in Speicherladeposition. Was prüfen?',['Ventil/Antrieb und Stellbefehl prüfen','Abgasleitung lackieren','Heizkörperdruck erhöhen','Gaszähler zurücksetzen'],0,'Stellbefehl, Antrieb und Mechanik müssen gegengeprüft werden.'],
['Hydraulik','Druck steigt beim Aufheizen stark, Sicherheitsventil tropft. Welche Komponente ist verdächtig?',['MAG','Außenfühler','Raumthermostat','Schmutzfänger'],0,'Ein defektes oder falsch eingestelltes MAG kann starke Druckanstiege im warmen Zustand verursachen.'],
['Hydraulik','Ein Schmutzfänger ist stark zugesetzt. Welche Folge ist typisch?',['Reduzierter Volumenstrom','Höherer Gasdruck','Mehr Warmwasserleistung','Höhere Außentemperatur'],0,'Ein zugesetzter Filter erhöht den Druckverlust und reduziert den Volumenstrom.'],
['Elektrik','Bei spannungsfreier Widerstandsmessung eines intakten NTC zeigt das Messgerät OL. Was bedeutet das?',['Unterbrechung im Messkreis','Kurzschluss des NTC','Pumpe läuft zu schnell','MAG ist zu klein'],0,'OL bedeutet bei der Widerstandsmessung typischerweise offenen Stromkreis.'],
['Elektrik','Du willst den Widerstand einer Pumpe messen. Die Pumpe ist noch unter Spannung. Was ist richtig?',['Spannungsfrei schalten und gegen Wiedereinschalten sichern','Direkt messen','Nur die Sicherung anschauen','Mit Strommessung beginnen'],0,'Widerstands- und Durchgangsmessungen werden nur an spannungsfreien Stromkreisen durchgeführt.'],
['Elektrik','Eine 230-V-Pumpe soll geprüft werden. Welche Messung zeigt, ob Versorgung anliegt?',['Spannungsmessung AC','Widerstandsmessung Ω','Durchgang ohne Spannung','Kapazitätsmessung am Rohr'],0,'Bei einer 230-V-Versorgung wird mit geeigneter AC-Spannungsmessung geprüft.'],
['Elektrik','Eine Sicherung löst sofort wieder aus. Was ist die sichere Vorgehensweise?',['Ursache des Kurzschlusses suchen, nicht mehrfach blind einschalten','Sicherung stärker wählen','Sicherung überbrücken','Pumpe direkt an Dauerstrom anschließen'],0,'Eine auslösende Schutzeinrichtung ist ein Hinweis auf einen Fehler; Ursache muss geklärt werden.'],
['Sensorik','Ein NTC hat bei steigender Temperatur einen sinkenden Widerstand. Welcher Sensortyp ist das?',['NTC','PTC','Relais','Potentiometer'],0,'NTC steht für Negative Temperature Coefficient: Widerstand sinkt mit steigender Temperatur.'],
['Sensorik','Ein Vorlauffühler zeigt unrealistische 120 °C bei kalter Anlage. Was zuerst?',['Fühlerwert und elektrische Verbindung plausibilisieren','MAG nachfüllen','Gasdruck erhöhen','Heizkörper entlüften'],0,'Unplausible Werte werden zuerst durch Messung, Steckverbindung und Leitungsprüfung eingegrenzt.'],
['Brenner','Ölbrenner startet nicht und zeigt Störung. Welche Reihenfolge ist sinnvoll?',['Störmeldung auswerten, Versorgung/Freigabe und Brennerkomponenten prüfen','Sofort Düse wechseln','Sofort Pumpe ausbauen','Heizkörperventile schließen'],0,'Eine systematische Diagnose verhindert unnötigen Teiletausch.'],
['Brenner','Ein Gasbrenner bekommt Startanforderung, aber das Gasventil öffnet nicht. Was prüfen?',['Freigabe, Sicherheitskette und Ansteuerung des Gasventils','Heizkörper entlüften','MAG-Vordruck messen','Schmutzfänger im Heizkreis öffnen'],0,'Vor einem Bauteiltausch sind Freigabe, Sicherheitskette und elektrische Ansteuerung zu prüfen.'],
['Brenner','Der Brenner läuft kurz an und geht anschließend auf Störung. Welche Ursache ist möglich?',['Flammenüberwachung bzw. Zündung prüfen','Heizkörperdruck erhöhen','Außenfühler lackieren','MAG entleeren'],0,'Zündung und Flammenüberwachung sind typische Prüfpunkte bei Abbruch nach Start.'],
['Sicherheit','Was ist vor Arbeiten an elektrischen Komponenten grundsätzlich wichtig?',['Freischalten, gegen Wiedereinschalten sichern und Spannungsfreiheit feststellen','Nur Handschuhe anziehen','Nur den Raumthermostat ausschalten','Sicherung wiederholt einschalten'],0,'Die fünf Sicherheitsregeln sind bei Arbeiten an elektrischen Anlagen maßgeblich.'],
['Sicherheit','Ein Sicherheitsventil öffnet wiederholt. Was sollte nicht gemacht werden?',['Ventil einfach dauerhaft blockieren','Anlagendruck und Ursache prüfen','MAG und Ausdehnung prüfen','Anlage kontrolliert untersuchen'],0,'Ein Sicherheitsventil darf nicht außer Funktion gesetzt werden; die Ursache des Druckanstiegs muss gefunden werden.'],
['Warmwasser','Speicher wird trotz laufender Ladepumpe kaum warm. Was passt?',['Volumenstrom, Umschaltung und Wärmeübertragung prüfen','Außenfühler abklemmen','MAG entleeren','Heizkörperthermostate entfernen'],0,'Bei laufender Ladepumpe müssen hydraulischer Weg, Ventilstellung und Wärmeübertragung geprüft werden.'],
['Warmwasser','Warmwasser ist kurz heiß und wird dann schnell kalt. Was kann ursächlich sein?',['Fehlerhafte Speicherladung oder Umschaltung','Zu großer Schmutzfänger','Zu niedriger Außentemperatur allein','Heizkörper entlüftet'],0,'Das Verhalten kann auf eine unterbrochene Speicherladung oder fehlerhafte Umschaltung hindeuten.'],
['Hydraulik','Ein Heizkörper bleibt unten kalt, oben warm. Welche Ursache ist eher möglich?',['Zu geringer Volumenstrom oder Ablagerungen','Zu hoher Anlagendruck allein','Defekter Außenfühler zwingend','Gasventil geschlossen'],0,'Ein kalter unterer Bereich kann bei reduziertem Durchfluss oder Ablagerungen auftreten.'],
['Hydraulik','Mehrere Heizkörper werden nicht warm, Pumpe läuft. Was ist ein sinnvoller nächster Schritt?',['Volumenstrom, Ventile und hydraulische Verteilung prüfen','Brennerdüse wechseln','Gasdruck erhöhen','Außenfühler überbrücken'],0,'Bei mehreren kalten Heizkörpern ist die hydraulische Versorgung zu prüfen.'],
['Elektrik','Eine Pumpe bekommt keine 230 V. Was prüfst du als Nächstes?',['Versorgungskette, Sicherung, Schalter/Regler und Verdrahtung','Pumpenrotor direkt öffnen','MAG prüfen','Heizkörper entlüften'],0,'Fehlt die Versorgung, wird die elektrische Kette von der Quelle bis zur Pumpe verfolgt.'],
['Elektrik','Eine 3-Wege-Ventil-Stellrichtung ist vertauscht. Was ist wahrscheinlich?',['Ansteuerung/Verdrahtung oder Parametrierung prüfen','MAG austauschen','Gasfilter reinigen','Heizkörper entlüften'],0,'Bei falscher Stellrichtung sind Ansteuerung, Verdrahtung und Parametrierung naheliegende Prüfpunkte.'],
['Sensorik','Ein Außentemperaturfühler zeigt dauerhaft -20 °C bei 15 °C Außentemperatur. Was tun?',['Fühler, Widerstand und Leitung prüfen','Heizkörper entlüften','MAG auf 3 bar setzen','Gasventil tauschen'],0,'Der Messwert ist unplausibel und muss am Sensor und in der Leitung geprüft werden.'],
['Sensorik','Ein Raumfühler zeigt stark schwankende Werte. Was kann die Ursache sein?',['Lose Verbindung oder Kontaktproblem','MAG zu groß','Gasdruck zu niedrig','Heizkörper zu klein'],0,'Schwankende elektrische Werte können durch Kontakt- oder Leitungsprobleme entstehen.'],
['Hydraulik','Der Differenzdruck im Heizkreis ist zu hoch. Was kann helfen?',['Pumpenregelung und hydraulischen Abgleich prüfen','MAG entleeren','Gasventil öffnen','Sensorleitung kurzschließen'],0,'Ein zu hoher Differenzdruck kann durch Pumpeneinstellung oder fehlenden hydraulischen Abgleich entstehen.'],
['Hydraulik','Ein Thermostatventil ist fest. Was ist die passende Maßnahme?',['Ventilstift/Mechanik vorsichtig prüfen und gangbar machen','Brenner tauschen','MAG auf 0 bar bringen','Gasdruck erhöhen'],0,'Ein festsitzendes Ventil kann den Heizkörper hydraulisch absperren.'],
['Sicherheit','Der Anlagendruck liegt bei heißer Anlage deutlich über dem zulässigen Bereich. Was zuerst?',['Anlage sichern und Ursache des Druckanstiegs klären','Sicherheitsventil blockieren','Druck weiter erhöhen','Sensor kurzschließen'],0,'Überdruck ist sicherheitsrelevant; Ursache und zulässiger Betriebsbereich müssen beachtet werden.'],
['Brenner','Ein Ölfilter ist zugesetzt. Welche Folge ist möglich?',['Brennstoffmangel und Brennerstörung','Höherer Heizungsdruck','Mehr Volumenstrom im Heizkreis','Kältere Außentemperatur'],0,'Ein zugesetzter Brennstofffilter kann die Brennstoffversorgung beeinträchtigen.'],
['Brenner','Ein Ölfeuerungsautomat meldet Flammenausfall. Was ist sinnvoll?',['Flammenbildung und Flammenüberwachung prüfen','MAG entleeren','Heizkörperventile schließen','Außenfühler abklemmen'],0,'Flammenbildung und Überwachung sind bei Flammenausfall zu prüfen.'],
['Warmwasser','Die Zirkulationsleitung ist kalt, obwohl Warmwasser häufig genutzt wird. Was prüfen?',['Zirkulationspumpe und Zirkulationsweg prüfen','Brennerdüse wechseln','MAG entleeren','Außenfühler tauschen'],0,'Fehlende Zirkulation kann durch Pumpe, Ventil oder unterbrochenen Leitungsweg entstehen.'],
['Warmwasser','Warmwasser hat lange Zapfzeiten bis es heiß wird. Welche Ursache ist möglich?',['Zirkulation oder hydraulische Wege prüfen','Gasdruck zwingend erhöhen','Heizkörper entlüften','MAG tauschen'],0,'Lange Zapfzeiten können durch fehlende Zirkulation oder hydraulische Probleme verursacht werden.'],
['Elektrik','Ein Relais klickt, aber der Verbraucher läuft nicht. Was ist sinnvoll?',['Spannung am Ausgang und Lastkreis prüfen','MAG-Vordruck messen','Heizkörper entlüften','Gasfilter wechseln'],0,'Das Klicken beweist nicht, dass der Lastkontakt tatsächlich Spannung zum Verbraucher durchschaltet.'],
['Elektrik','Ein Kondensator einer einphasigen Pumpe ist deutlich außerhalb seiner Nennkapazität. Was ist möglich?',['Anlaufprobleme oder fehlendes Drehmoment','Höherer Anlagendruck','Mehr Warmwasserleistung','Besserer hydraulischer Abgleich'],0,'Ein fehlerhafter Betriebskondensator kann das Start- und Laufverhalten des Motors beeinträchtigen.'],
['Sensorik','Bei einem NTC ist ein sehr kleiner Widerstand trotz kaltem Fühler messbar. Was kann das bedeuten?',['Kurzschluss oder Fühlerfehler','Normaler NTC-Betrieb zwingend','MAG zu groß','Gasventil offen'],0,'Ein ungewöhnlich kleiner Widerstand kann auf Kurzschluss oder einen defekten Sensor hinweisen.'],
['Hydraulik','Ein Heizkreis hat trotz laufender Pumpe kaum Durchfluss. Was prüfst du?',['Absperrungen, Filter, Ventile und Luft im System','Nur den Außenfühler','Nur den Gasdruck','Nur das Raumthermostat'],0,'Mehrere hydraulische Ursachen können den Durchfluss begrenzen und sollten systematisch geprüft werden.'],
['Sicherheit','Bei einer Gasgeruchsmeldung im Heizraum ist die erste Priorität?',['Gefahrenbereich sichern und geeignete Notfall-/Fachmaßnahmen einleiten','Brenner mehrfach starten','Gasventil elektrisch überbrücken','Nur Heizkörper entlüften'],0,'Bei Gasgeruch steht die Sicherheit an erster Stelle; keine Zündquellen erzeugen und nach den geltenden Betriebsanweisungen handeln.'],
['Brenner','Ein Brenner hat keinen Flammenaufbau. Was kann die Ursache sein?',['Fehlende Zündung, Brennstoffversorgung oder Freigabe','Zu niedriger Heizkörperdruck','MAG zu groß','Thermostatventil offen'],0,'Für Flammenaufbau müssen Freigabe, Brennstoffversorgung und Zündung zusammenpassen.'],
['Hydraulik','Der Rücklauf ist ungewöhnlich warm und die Räume werden trotzdem nicht ausreichend warm. Was kann geprüft werden?',['Volumenstrom, Heizflächen und hydraulische Verteilung','Nur den Gaszähler','Nur den Außentemperaturfühler','Nur das MAG'],0,'Die Wärmeabgabe hängt von Volumenstrom, Temperaturspreizung und Heizflächen ab.'],
['Warmwasser','Die Speicher-Solltemperatur wird erreicht, aber der Brenner taktet sehr häufig. Was kann helfen?',['Hydraulik, Leistungseinstellung und Regelparameter prüfen','MAG absichtlich entleeren','Außenfühler kurzschließen','Sicherheitsventil blockieren'],0,'Häufiges Takten kann mehrere Ursachen haben; hydraulische und regelungstechnische Parameter sollten geprüft werden.'],
